<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bananaet</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app">
    <!-- Auth Screen -->
    <div id="auth-screen" class="screen active">
      <div class="auth-container">
        <h1 class="logo">🍌 Bananaet</h1>
        <p class="tagline">Collect. Trade. Flex.</p>

        <div id="login-form" class="auth-form">
          <input type="text" id="login-username" placeholder="Username" maxlength="20" autocomplete="off">
          <button onclick="login()">Log In</button>
          <p class="switch-text">New here? <a href="#" onclick="showRegister()">Register</a></p>
        </div>

        <div id="register-form" class="auth-form" style="display:none;">
          <input type="text" id="reg-username" placeholder="Pick a username" maxlength="20" autocomplete="off">
          <input type="text" id="reg-invite" placeholder="Invite code" autocomplete="off">
          <button onclick="register()">Join Bananaet</button>
          <p class="switch-text">Already have an account? <a href="#" onclick="showLogin()">Log in</a></p>
        </div>

        <p id="auth-error" class="error"></p>
      </div>
    </div>

    <!-- Dashboard Screen -->
    <div id="dashboard-screen" class="screen">
      <header>
        <span class="logo-small">🍌 Bananaet</span>
        <div class="user-info">
          <span id="display-username"></span>
          <span id="display-bananas" class="banana-count"></span>
          <button class="btn-small" onclick="logout()">Logout</button>
        </div>
      </header>
      <nav class="tab-bar">
        <button class="tab active" onclick="switchTab('shop')">Shop</button>
        <button class="tab" onclick="switchTab('inventory')">Collection</button>
      </nav>
      <main>
        <div id="daily-bonus-banner" class="bonus-banner" style="display:none;">
          <p>🍌 Daily bonus: +<span id="bonus-amount"></span> Bananas!</p>
        </div>

        <!-- Shop Tab -->
        <div id="tab-shop" class="tab-content active">
          <div id="packs-grid" class="packs-grid"></div>
        </div>

        <!-- Inventory Tab -->
        <div id="tab-inventory" class="tab-content">
          <div id="inventory-stats" class="inventory-stats"></div>
          <div id="inventory-grid" class="inventory-grid"></div>
        </div>
      </main>

      <!-- Pack Opening Overlay -->
      <div id="pack-overlay" class="pack-overlay" style="display:none;">
        <div class="pack-reveal">
          <div id="pack-opening-text" class="pack-opening-text">Opening...</div>
          <div id="reveal-card" class="reveal-card" style="display:none;">
            <div id="reveal-rarity" class="reveal-rarity"></div>
            <div id="reveal-emoji" class="reveal-emoji"></div>
            <div id="reveal-name" class="reveal-name"></div>
          </div>
          <button id="reveal-close" class="reveal-close" style="display:none;" onclick="closeReveal()">Continue</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
