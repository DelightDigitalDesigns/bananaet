<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" fill="none">
  <!-- Banana Body -->
  <ellipse cx="100" cy="160" rx="52" ry="100" fill="#FFD639" transform="rotate(-8 100 160)"/>
  <ellipse cx="100" cy="160" rx="48" ry="96" fill="#FFE566" transform="rotate(-8 100 160)"/>
  <ellipse cx="90" cy="150" rx="28" ry="70" fill="#FFF0A0" opacity="0.4" transform="rotate(-8 90 150)"/>
  
  <!-- Brown tip top -->
  <ellipse cx="96" cy="62" rx="14" ry="10" fill="#8B6914" transform="rotate(-12 96 62)"/>
  <ellipse cx="96" cy="62" rx="10" ry="7" fill="#A0781E" transform="rotate(-12 96 62)"/>
  
  <!-- Brown tip bottom -->
  <ellipse cx="104" cy="258" rx="12" ry="8" fill="#8B6914" transform="rotate(-5 104 258)"/>
  <ellipse cx="104" cy="258" rx="8" ry="5" fill="#A0781E" transform="rotate(-5 104 258)"/>
  
  <!-- Star eyes (excited!) -->
  <!-- Left star -->
  <polygon points="78,128 81,136 90,136 83,141 86,150 78,145 70,150 73,141 66,136 75,136" fill="#2D1B00"/>
  <polygon points="78,130 80,135 87,135 82,139 84,147 78,143 72,147 74,139 69,135 76,135" fill="#FFF0A0"/>
  
  <!-- Right star -->
  <polygon points="118,125 121,133 130,133 123,138 126,147 118,142 110,147 113,138 106,133 115,133" fill="#2D1B00"/>
  <polygon points="118,127 120,132 127,132 122,136 124,144 118,140 112,144 114,136 109,132 116,132" fill="#FFF0A0"/>
  
  <!-- Big open smile -->
  <path d="M72 165 Q98 200 128 165" stroke="#2D1B00" stroke-width="3.5" stroke-linecap="round" fill="#2D1B00"/>
  <path d="M76 166 Q98 194 124 166" fill="#FF6B6B"/>
  <!-- Tongue -->
  <ellipse cx="100" cy="185" rx="12" ry="8" fill="#FF8A8A"/>
  
  <!-- Blush spots -->
  <ellipse cx="62" cy="160" rx="10" ry="6" fill="#FFB347" opacity="0.6"/>
  <ellipse cx="138" cy="157" rx="10" ry="6" fill="#FFB347" opacity="0.6"/>
  
  <!-- Left arm raised high -->
  <path d="M50 165 Q22 120 30 80" stroke="#FFD639" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M50 165 Q22 120 30 80" stroke="#FFE566" stroke-width="8" stroke-linecap="round" fill="none"/>
  <circle cx="30" cy="76" r="10" fill="#FFD639"/>
  <circle cx="30" cy="76" r="7" fill="#FFE566"/>
  
  <!-- Right arm raised high -->
  <path d="M150 163 Q178 118 170 78" stroke="#FFD639" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M150 163 Q178 118 170 78" stroke="#FFE566" stroke-width="8" stroke-linecap="round" fill="none"/>
  <circle cx="170" cy="74" r="10" fill="#FFD639"/>
  <circle cx="170" cy="74" r="7" fill="#FFE566"/>
  
  <!-- Sparkle effects -->
  <g fill="#FFD639">
    <polygon points="20,60 22,55 24,60 29,62 24,64 22,69 20,64 15,62" opacity="0.8"/>
    <polygon points="175,58 177,53 179,58 184,60 179,62 177,67 175,62 170,60" opacity="0.8"/>
    <polygon points="100,40 102,34 104,40 110,42 104,44 102,50 100,44 94,42" opacity="0.6"/>
  </g>
  
  <!-- Feet (jumping) -->
  <ellipse cx="80" cy="266" rx="16" ry="8" fill="#D4A017"/>
  <ellipse cx="80" cy="265" rx="14" ry="6" fill="#E8B825"/>
  <ellipse cx="120" cy="266" rx="16" ry="8" fill="#D4A017"/>
  <ellipse cx="120" cy="265" rx="14" ry="6" fill="#E8B825"/>
</svg>
