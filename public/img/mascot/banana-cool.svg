<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" fill="none">
  <!-- Banana Body -->
  <ellipse cx="100" cy="160" rx="52" ry="100" fill="#FFD639" transform="rotate(-8 100 160)"/>
  <ellipse cx="100" cy="160" rx="48" ry="96" fill="#FFE566" transform="rotate(-8 100 160)"/>
  <ellipse cx="90" cy="150" rx="28" ry="70" fill="#FFF0A0" opacity="0.4" transform="rotate(-8 90 150)"/>
  
  <!-- Brown tip top -->
  <ellipse cx="96" cy="62" rx="14" ry="10" fill="#8B6914" transform="rotate(-12 96 62)"/>
  <ellipse cx="96" cy="62" rx="10" ry="7" fill="#A0781E" transform="rotate(-12 96 62)"/>
  
  <!-- Brown tip bottom -->
  <ellipse cx="104" cy="258" rx="12" ry="8" fill="#8B6914" transform="rotate(-5 104 258)"/>
  <ellipse cx="104" cy="258" rx="8" ry="5" fill="#A0781E" transform="rotate(-5 104 258)"/>
  
  <!-- Sunglasses -->
  <rect x="60" y="126" width="32" height="24" rx="4" fill="#1a1a2e" transform="rotate(-3 76 138)"/>
  <rect x="106" y="123" width="32" height="24" rx="4" fill="#1a1a2e" transform="rotate(-3 122 135)"/>
  <!-- Lens shine -->
  <rect x="63" y="129" width="8" height="4" rx="2" fill="white" opacity="0.3" transform="rotate(-3 67 131)"/>
  <rect x="109" y="126" width="8" height="4" rx="2" fill="white" opacity="0.3" transform="rotate(-3 113 128)"/>
  <!-- Bridge -->
  <path d="M92 135 Q98 130 106 133" stroke="#1a1a2e" stroke-width="4" fill="none"/>
  <!-- Arms of glasses -->
  <path d="M60 133 L48 130" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round"/>
  <path d="M138 130 L150 127" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Smirk mouth -->
  <path d="M82 170 Q100 182 126 168" stroke="#2D1B00" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  
  <!-- Blush spots -->
  <ellipse cx="68" cy="162" rx="8" ry="5" fill="#FFB347" opacity="0.4"/>
  <ellipse cx="132" cy="159" rx="8" ry="5" fill="#FFB347" opacity="0.4"/>
  
  <!-- Left arm (finger guns) -->
  <path d="M52 170 Q30 152 22 130" stroke="#FFD639" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M52 170 Q30 152 22 130" stroke="#FFE566" stroke-width="8" stroke-linecap="round" fill="none"/>
  <circle cx="20" cy="126" r="10" fill="#FFD639"/>
  <circle cx="20" cy="126" r="7" fill="#FFE566"/>
  <!-- Finger gun -->
  <path d="M14 122 L2 114" stroke="#FFE566" stroke-width="4" stroke-linecap="round"/>
  <path d="M14 128 L6 128" stroke="#FFE566" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Right arm (thumbs up) -->
  <path d="M148 168 Q170 148 176 122" stroke="#FFD639" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M148 168 Q170 148 176 122" stroke="#FFE566" stroke-width="8" stroke-linecap="round" fill="none"/>
  <circle cx="178" cy="118" r="10" fill="#FFD639"/>
  <circle cx="178" cy="118" r="7" fill="#FFE566"/>
  <!-- Thumb -->
  <path d="M178 112 L178 98" stroke="#FFE566" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Feet -->
  <ellipse cx="82" cy="262" rx="16" ry="8" fill="#D4A017"/>
  <ellipse cx="82" cy="261" rx="14" ry="6" fill="#E8B825"/>
  <ellipse cx="116" cy="264" rx="16" ry="8" fill="#D4A017"/>
  <ellipse cx="116" cy="263" rx="14" ry="6" fill="#E8B825"/>
</svg>
