  <!-- Arms hanging down -->
  <path d="M52 175 Q38 200 42 230" stroke="#FFD639" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M52 175 Q38 200 42 230" stroke="#FFE566" stroke-width="8" stroke-linecap="round" fill="none"/>
  <circle cx="42" cy="234" r="10" fill="#FFD639"/>
  <circle cx="42" cy="234" r="7" fill="#FFE566"/>
  
  <path d="M148 173 Q162 198 158 228" stroke="#FFD639" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M148 173 Q162 198 158 228" stroke="#FFE566" stroke-width="8" stroke-linecap="round" fill="none"/>
  <circle cx="158" cy="232" r="10" fill="#FFD639"/>
  <circle cx="158" cy="232" r="7" fill="#FFE566"/>
  
  <!-- Feet -->
  <ellipse cx="84" cy="267" rx="16" ry="8" fill="#D4A017"/>
  <ellipse cx="84" cy="266" rx="14" ry="6" fill="#E8B825"/>
  <ellipse cx="116" cy="268" rx="16" ry="8" fill="#D4A017"/>
