  <ellipse cx="100" cy="165" rx="48" ry="96" fill="#FFE566" transform="rotate(-5 100 165)"/>
  <ellipse cx="92" cy="155" rx="28" ry="70" fill="#FFF0A0" opacity="0.4" transform="rotate(-5 92 155)"/>
  
  <!-- Brown tip top -->
  <ellipse cx="97" cy="67" rx="14" ry="10" fill="#8B6914" transform="rotate(-8 97 67)"/>
  <ellipse cx="97" cy="67" rx="10" ry="7" fill="#A0781E" transform="rotate(-8 97 67)"/>
  
  <!-- Brown tip bottom -->
  <ellipse cx="103" cy="263" rx="12" ry="8" fill="#8B6914" transform="rotate(-3 103 263)"/>
  <ellipse cx="103" cy="263" rx="8" ry="5" fill="#A0781E" transform="rotate(-3 103 263)"/>
  
