  <!-- Sad eyebrows -->
  <path d="M66 128 Q78 122 90 130" stroke="#2D1B00" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M106 127 Q118 119 130 125" stroke="#2D1B00" stroke-width="3" stroke-linecap="round" fill="none"/>
  
  <!-- Sad mouth (frown) -->
