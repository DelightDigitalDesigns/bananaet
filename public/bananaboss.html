<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Monitor</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Fredoka', sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
    }

    /* Auth */
    .auth-container {
      max-width: 340px;
      margin: 15vh auto;
      padding: 2rem;
      text-align: center;
    }
    .auth-container h1 { font-size: 1.4rem; margin-bottom: 1.5rem; color: #f5c542; }
    .auth-container input {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 0.75rem;
      border: 1px solid #30363d;
      border-radius: 8px;
      background: #161b22;
      color: #e6edf3;
      font-family: inherit;
      font-size: 0.95rem;
    }
    .auth-container button {
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: 8px;
      background: #f5c542;
      color: #0d1117;
      font-family: inherit;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }
    .auth-container button:hover { background: #e0b035; }
    .auth-error { color: #f85149; margin-top: 0.75rem; font-size: 0.9rem; }

    /* Dashboard */
    .dashboard { display: none; max-width: 900px; margin: 0 auto; padding: 1.5rem; }
    .dashboard.active { display: block; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1rem;
      border-bottom: 1px solid #21262d;
      margin-bottom: 1.5rem;
    }
    header h1 { font-size: 1.1rem; color: #f5c542; }
    .btn-logout {
      padding: 0.4rem 0.8rem;
      border: 1px solid #30363d;
      border-radius: 6px;
      background: transparent;
      color: #e6edf3;
      font-family: inherit;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .btn-logout:hover { background: #21262d; }

    /* Kill Switch */
    .kill-switch-section {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .kill-switch-label { font-weight: 600; }
    .kill-switch-status { font-size: 0.85rem; color: #888; margin-top: 0.25rem; }
    .kill-btn {
      padding: 0.6rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .kill-btn.active {
      background: #10b981;
      color: #fff;
    }
    .kill-btn.killed {
      background: #f85149;
      color: #fff;
    }

    /* Chat Logs */
    .logs-section {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 1.25rem;
    }
    .logs-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    .logs-header h2 { font-size: 1rem; }
    .logs-controls {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    .logs-controls select, .logs-controls button {
      padding: 0.4rem 0.6rem;
      border: 1px solid #30363d;
      border-radius: 6px;
      background: #0d1117;
      color: #e6edf3;
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .logs-controls button:hover { background: #21262d; }

    .chat-log {
      max-height: 60vh;
      overflow-y: auto;
      padding: 0.5rem;
    }
    .log-entry {
      padding: 0.5rem 0;
      border-bottom: 1px solid #21262d;
      font-size: 0.9rem;
      line-height: 1.4;
    }
    .log-entry:last-child { border-bottom: none; }
    .log-time { color: #666; font-size: 0.75rem; margin-right: 0.5rem; }
    .log-user { color: #f5c542; font-weight: 600; margin-right: 0.5rem; }
    .log-room { color: #888; font-size: 0.75rem; font-weight: 600; }
    .log-empty { color: #666; text-align: center; padding: 2rem; }

    .pagination {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1rem;
    }
    .pagination button {
      padding: 0.4rem 0.75rem;
      border: 1px solid #30363d;
      border-radius: 6px;
      background: #0d1117;
      color: #e6edf3;
      font-family: inherit;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .pagination button:hover { background: #21262d; }
    .pagination button:disabled { opacity: 0.4; cursor: default; }
    .pagination span { padding: 0.4rem 0.5rem; font-size: 0.85rem; color: #888; }
  </style>
</head>
<body>
  <!-- Auth -->
  <div id="auth-screen" class="auth-container">
    <h1>🍌 System Monitor</h1>
    <div id="auth-form-login">
      <input type="text" id="sa-username" placeholder="Username" autocomplete="off">
      <input type="password" id="sa-password" placeholder="Password" autocomplete="off">
      <button id="sa-submit" onclick="saLogin()">Log In</button>
    </div>
    <p id="sa-error" class="auth-error"></p>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" class="dashboard">
    <header>
      <h1>🍌 Bananalet Monitor</h1>
      <button class="btn-logout" onclick="saLogout()">Logout</button>
    </header>

    <div class="kill-switch-section">
      <div>
        <div class="kill-switch-label">Chat Kill Switch</div>
        <div id="kill-status" class="kill-switch-status">Loading...</div>
      </div>
      <button id="kill-btn" class="kill-btn" onclick="toggleKill()">...</button>
    </div>

    <div class="logs-section">
      <div class="logs-header">
        <h2>Chat Logs</h2>
        <div class="logs-controls">
          <select id="room-filter" onchange="loadLogs(1)">
            <option value="">All Rooms</option>
            <option value="main">Main</option>
            <option value="admin">Admin</option>
          </select>
          <button onclick="loadLogs(currentPage)">Refresh</button>
        </div>
      </div>
      <div id="chat-log" class="chat-log"></div>
      <div id="pagination" class="pagination"></div>
    </div>
  </div>

  <script>
    let currentPage = 1;

    // Check if superadmin exists, check session
    async function init() {
      // Check existing session
      try {
        const res = await fetch('/api/superadmin/me');
        if (res.ok) {
          showDashboard();
          return;
        }
      } catch(e) {}

      // Check if superadmin account exists
      try {
        const res = await fetch('/api/superadmin/exists');
        const data = await res.json();
        if (!data.exists) {
          document.getElementById('sa-submit').textContent = 'Create Account';
          document.getElementById('sa-submit').onclick = saRegister;
        }
      } catch(e) {}
    }

    async function saLogin() {
      const username = document.getElementById('sa-username').value.trim();
      const password = document.getElementById('sa-password').value;
      if (!username || !password) {
        document.getElementById('sa-error').textContent = 'Fill in both fields';
        return;
      }

      try {
        const res = await fetch('/api/superadmin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok) {
          document.getElementById('sa-error').textContent = data.error;
          return;
        }
        showDashboard();
      } catch(e) {
        document.getElementById('sa-error').textContent = 'Connection error';
      }
    }

    async function saRegister() {
      const username = document.getElementById('sa-username').value.trim();
      const password = document.getElementById('sa-password').value;
      if (!username || !password) {
        document.getElementById('sa-error').textContent = 'Fill in both fields';
        return;
      }

      try {
        const res = await fetch('/api/superadmin/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok) {
          document.getElementById('sa-error').textContent = data.error;
          return;
        }
        showDashboard();
      } catch(e) {
        document.getElementById('sa-error').textContent = 'Connection error';
      }
    }

    async function saLogout() {
      await fetch('/api/superadmin/logout', { method: 'POST' });
      location.reload();
    }

    function showDashboard() {
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('dashboard').classList.add('active');
      loadKillStatus();
      loadLogs(1);
    }

    // Kill switch
    async function loadKillStatus() {
      try {
        const res = await fetch('/api/superadmin/chat-status');
        const data = await res.json();
        updateKillUI(data.killed);
      } catch(e) {}
    }

    function updateKillUI(killed) {
      const btn = document.getElementById('kill-btn');
      const status = document.getElementById('kill-status');
      if (killed) {
        btn.textContent = 'Enable Chat';
        btn.className = 'kill-btn killed';
        status.textContent = 'Chat is DISABLED — no messages can be sent';
        status.style.color = '#f85149';
      } else {
        btn.textContent = 'Kill Chat';
        btn.className = 'kill-btn active';
        status.textContent = 'Chat is active';
        status.style.color = '#10b981';
      }
    }

    async function toggleKill() {
      const btn = document.getElementById('kill-btn');
      const isCurrentlyKilled = btn.classList.contains('killed');
      try {
        const res = await fetch('/api/superadmin/chat-toggle', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ killed: !isCurrentlyKilled })
        });
        const data = await res.json();
        updateKillUI(data.killed);
      } catch(e) {}
    }

    // Chat logs
    async function loadLogs(page) {
      currentPage = page;
      const room = document.getElementById('room-filter').value;
      const url = `/api/superadmin/chat-logs?page=${page}&limit=100${room ? '&room=' + room : ''}`;

      try {
        const res = await fetch(url);
        const data = await res.json();

        const logEl = document.getElementById('chat-log');
        if (data.logs.length === 0) {
          logEl.innerHTML = '<div class="log-empty">No messages yet</div>';
        } else {
          logEl.innerHTML = data.logs.map(m => {
            const time = new Date(m.created_at + 'Z').toLocaleString();
            return `<div class="log-entry">
              <span class="log-time">${time}</span>
              <span class="log-room">[${m.room}]</span>
              <span class="log-user">${m.username}:</span>
              <span>${escapeHtml(m.message)}</span>
            </div>`;
          }).join('');
        }

        // Pagination
        const pagEl = document.getElementById('pagination');
        if (data.totalPages > 1) {
          pagEl.innerHTML = `
            <button ${page <= 1 ? 'disabled' : ''} onclick="loadLogs(${page - 1})">← Prev</button>
            <span>Page ${page} of ${data.totalPages}</span>
            <button ${page >= data.totalPages ? 'disabled' : ''} onclick="loadLogs(${page + 1})">Next →</button>
          `;
        } else {
          pagEl.innerHTML = '';
        }
      } catch(e) {
        document.getElementById('chat-log').innerHTML = '<div class="log-empty">Failed to load logs</div>';
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    init();
  </script>
</body>
</html>
